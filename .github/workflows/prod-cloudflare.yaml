name: Deploy generic static site to production

on:
  workflow_run:
    workflows: ["Package generic static site from push"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy-to-prod:
    if: ${{ (github.event.workflow_run.conclusion == 'success') && (github.repository == vars.MAIN_REPO) }}
    uses: omsf/static-site-tools/.github/workflows/prod-cloudflare.yaml@bddfe9537ca08333360801f82a95bb4adaff314e
    permissions:
      actions: read
    with:
      run-id: ${{ github.event.workflow_run.id }}
      project-name: ${{ vars.CLOUDFLARE_PROJECT_NAME }}
      html-dir: "."
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
